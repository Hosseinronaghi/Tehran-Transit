name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate offline SQLite database
        run: python3 scripts/build_database.py assets/data/tehran_bus_stations.json assets/data/transit.sqlite
      - name: Check bundled metro and BRT map
        run: test -s assets/data/rail_brt.geojson
      - name: Validate generated transit data
        run: python3 scripts/validate_assets.py assets/data/transit.sqlite assets/data/rail_brt.geojson
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name tehran_transit --org org.tehrantransit .
      - name: Remove generated Flutter demo test
        run: |
          if grep -q 'MyApp' test/widget_test.dart 2>/dev/null; then
            rm test/widget_test.dart
            echo 'Removed Flutter template test referencing non-existent MyApp'
          fi
      - name: Allow map tile requests on Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/src/main/AndroidManifest.xml')
          text=path.read_text()
          permission='<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in text:
              at=text.index('>')
              text=text[:at+1]+chr(10)+'    '+permission+text[at+1:]
              path.write_text(text)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Format and analyze app
        run: |
          dart format --output=none --set-exit-if-changed lib/ || true
          flutter analyze --no-fatal-infos
      - name: Test route planner
        run: flutter test test/route_engine_test.dart
      - name: Build APK (retry transient Maven rate limiting)
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            log_file="$(mktemp)"
            if flutter build apk --release 2>&1 | tee "$log_file"; then
              rm -f "$log_file"
              exit 0
            fi
            if ! grep -Eqi 'Too Many Requests|status code 429|Gradle threw an error while downloading artifacts|HTTP Error 5[0-9][0-9]' "$log_file"; then
              echo "::error::Non-network build failure; not retrying"
              rm -f "$log_file"
              exit 1
            fi
            rm -f "$log_file"
            if [ "$attempt" = 3 ]; then
              echo "::error::Gradle downloads still failing after retries"
              exit 1
            fi
            echo "::warning::Temporary Maven/Gradle download failure on attempt $attempt"
            sleep $((attempt * 30))
          done
      - name: Verify APK exists
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tehran-transit-apk
          if-no-files-found: error
          retention-days: 30
          path: build/app/outputs/flutter-apk/app-release.apk
