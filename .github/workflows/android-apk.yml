name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.*'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a signed stable APK from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}-${{ inputs.publish || false }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    if: ${{ !inputs.publish || github.ref == 'refs/heads/main' }}
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate and validate offline transit data
        run: |
          python3 scripts/build_database.py assets/data/tehran_bus_stations.json assets/data/transit.sqlite
          python3 scripts/validate_assets.py assets/data/transit.sqlite assets/data/rail_brt.geojson
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Configure stable Android signing for publication
        if: ${{ inputs.publish }}
        env:
          RAHA_REQUIRE_RELEASE_SIGNING: '1'
          RAHA_KEYSTORE_B64: ${{ secrets.RAHA_KEYSTORE_B64 }}
          RAHA_STORE_PASSWORD: ${{ secrets.RAHA_STORE_PASSWORD }}
          RAHA_KEY_ALIAS: ${{ secrets.RAHA_KEY_ALIAS }}
          RAHA_KEY_PASSWORD: ${{ secrets.RAHA_KEY_PASSWORD }}
        run: python3 scripts/configure_android_signing.py
      - name: Mark preview builds
        if: ${{ !inputs.publish }}
        run: python3 scripts/configure_android_signing.py
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting and analyze app
        run: |
          dart format --output=none --set-exit-if-changed lib/{app_updates,offline_map,raha_settings,route_engine,timetable,timetable_page,transit_v05}.dart test/{app_updates,offline_features}_test.dart
          flutter analyze --no-pub --no-fatal-infos
      - name: Run Flutter regression tests
        run: flutter test --no-pub
      - name: Build APK (retry transient Maven rate limiting)
        shell: bash
        env:
          RAHA_MAP_MANIFEST_URL: ${{ vars.RAHA_MAP_MANIFEST_URL }}
          RAHA_MAP_MIRROR_URL: ${{ vars.RAHA_MAP_MIRROR_URL }}
          RAHA_STORE_PASSWORD: ${{ inputs.publish && secrets.RAHA_STORE_PASSWORD || '' }}
          RAHA_KEY_ALIAS: ${{ inputs.publish && secrets.RAHA_KEY_ALIAS || '' }}
          RAHA_KEY_PASSWORD: ${{ inputs.publish && secrets.RAHA_KEY_PASSWORD || '' }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            log_file="$(mktemp)"
            if flutter build apk --release --no-pub \
              --dart-define="RAHA_MAP_MANIFEST_URL=${RAHA_MAP_MANIFEST_URL:-https://github.com/Hosseinronaghi/Tehran-Transit/releases/download/tehran-offline-maps/manifest.json}" \
              --dart-define="RAHA_MAP_MIRROR_URL=$RAHA_MAP_MIRROR_URL" \
              2>&1 | tee "$log_file"; then
              rm -f "$log_file"
              exit 0
            fi
            if ! grep -Eqi 'Too Many Requests|status code 429|Gradle threw an error while downloading artifacts|HTTP Error 5[0-9][0-9]' "$log_file"; then
              rm -f "$log_file"
              exit 1
            fi
            rm -f "$log_file"
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
      - name: Verify APK identity, version and certificate
        id: verify
        env:
          PUBLISH: ${{ inputs.publish || false }}
          EXPECTED_SIGNER: ${{ vars.RAHA_SIGNING_SHA256 }}
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          apk=build/app/outputs/flutter-apk/app-release.apk
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          name="${version%+*}"
          code="${version##*+}"
          "$tools/aapt" dump badging "$apk" > apk-badging.txt
          grep -F "package: name='org.tehrantransit.tehran_transit' versionCode='$code' versionName='$name'" apk-badging.txt
          "$tools/apksigner" verify --print-certs "$apk" > apk-signing.txt
          if [ "$PUBLISH" = 'true' ]; then
            actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-signing.txt)"
            expected="$(printf '%s' "$EXPECTED_SIGNER" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            [[ "$expected" =~ ^[0-9a-f]{64}$ && "$expected" == "$actual" ]]
            ! grep -q 'CN=Android Debug' apk-signing.txt
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: tehran-transit-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            APP_SIGNING.txt
            apk-signing.txt

  publish:
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tehran-transit-apk
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          set -euo pipefail
          releases="$(gh api --paginate 'repos/${{ github.repository }}/releases?per_page=100')"
          previous="$(jq -sr '[.[][] | select(.draft == false and .prerelease == false)
            | select(any(.assets[]; .name | endswith(".apk")))
            | .tag_name | capture("\\+(?<code>[0-9]+)$") | .code | tonumber] | max // 0' <<< "$releases")"
          [[ "${VERSION##*+}" -gt "$previous" ]]
          apk="Raha-Tehran-$VERSION.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "v$VERSION" "$apk" "$apk.sha256" \
            --target "$GITHUB_SHA" --title "Raha Tehran $VERSION" --generate-notes
