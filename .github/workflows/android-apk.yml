name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download upstream bus dataset
        run: |
          python3 - <<'PY'
          import urllib.request, zipfile, io, pathlib
          url = 'https://github.com/mosayeb-a/tehran-bus-data/archive/refs/heads/main.zip'
          raw = urllib.request.urlopen(url, timeout=90).read()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              name = next(n for n in z.namelist() if n.endswith('/data/stations.json'))
              pathlib.Path('stations.json').write_bytes(z.read(name))
          PY
      - name: Generate offline SQLite database
        run: python3 scripts/build_database.py stations.json assets/data/transit.sqlite
      - name: Fetch OSM metro and BRT map data
        run: python3 scripts/fetch_osm_transit.py assets/data/rail_brt.geojson
      - name: Validate generated transit data
        run: python3 scripts/validate_assets.py assets/data/transit.sqlite assets/data/rail_brt.geojson
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --project-name tehran_transit --org org.tehrantransit .
      - name: Allow map tile requests on Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/src/main/AndroidManifest.xml')
          text=path.read_text()
          permission='<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in text:
              at=text.index('>')
              text=text[:at+1]+chr(10)+'    '+permission+text[at+1:]
              path.write_text(text)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: tehran-transit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
