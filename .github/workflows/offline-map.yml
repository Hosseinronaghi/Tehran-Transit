name: Generate and publish Tehran offline map
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_tehran_map.py
      - .github/workflows/offline-map.yml

permissions:
  contents: write

concurrency:
  group: tehran-offline-map-release
  cancel-in-progress: true

jobs:
  map:
    if: false # Duplicate publisher disabled; use publish-offline-map.yml
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install map generation libraries
        run: |
          python -m pip install --disable-pip-version-check 'osmium==4.1.1' 'Pillow==11.3.0'
      - name: Generate city raster tiles from raw OpenStreetMap PBF
        run: |
          python scripts/build_tehran_map.py --output tehran.mbtiles
      - name: Validate licensed offline MBTiles
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          file=Path('tehran.mbtiles')
          assert file.stat().st_size > 500000
          with sqlite3.connect(file) as db:
              assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
              fmt=db.execute("SELECT value FROM metadata WHERE name='format'").fetchone()[0]
              assert fmt=='jpg'
              n=db.execute('SELECT COUNT(*) FROM tiles').fetchone()[0]
              assert n>=700, n
              zooms=db.execute('SELECT MIN(zoom_level),MAX(zoom_level) FROM tiles').fetchone()
              assert zooms == (10,15), zooms
              print('Validated offline Tehran tiles:',n,zooms,file.stat().st_size)
          PY
      - name: Generate quarterly manifest and source attribution
        run: |
          python - <<'PY'
          import hashlib,json,datetime,pathlib
          file=pathlib.Path('tehran.mbtiles')
          day=datetime.datetime.now(datetime.timezone.utc).date()
          edition=f'{day.year}-Q{(day.month-1)//3+1}'
          data={
              'edition':edition,
              'format':'raster_mbtiles',
              'url':'https://github.com/Hosseinronaghi/Tehran-Transit/releases/download/tehran-offline-maps/tehran.mbtiles',
              'sha256':hashlib.file_digest(file.open('rb'),'sha256').hexdigest(),
              'bytes':file.stat().st_size,
              'source':'Geofabrik Iran OSM PBF; map data © OpenStreetMap contributors; ODbL 1.0',
              'bounds':[50.90,35.39,51.85,36.02],
              'maxzoom':15,
          }
          pathlib.Path('manifest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Edition',edition,'MBTiles bytes',data['bytes'],'SHA256',data['sha256'])
          PY
      - name: Publish official optional map package to project GitHub Release
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          if ! gh release view tehran-offline-maps >/dev/null 2>&1; then
            gh release create tehran-offline-maps \
              --title 'نقشه آفلاین اختیاری رها تهران / Raha Tehran offline maps' \
              --notes 'Optional map based on raw OpenStreetMap data (ODbL 1.0); rendered independently from the Geofabrik Iran extract. © OpenStreetMap contributors. This is an approximate street map, not official navigation. Download only at user request.' \
              --latest=false
          fi
          gh release upload tehran-offline-maps tehran.mbtiles manifest.json --clobber
          gh release view tehran-offline-maps --json url --jq .url
