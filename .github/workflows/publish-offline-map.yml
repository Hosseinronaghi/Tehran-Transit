name: Publish Optional Tehran Offline Map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_tehran_mbtiles.py'
      - '.github/workflows/publish-offline-map.yml'
  schedule:
    - cron: '17 3 1 1,4,7,10 *'

permissions:
  contents: write

concurrency:
  group: tehran-offline-map-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OSM PBF reader and raster renderer
        run: python -m pip install --quiet 'osmium>=4.0,<5' 'Pillow>=11,<12'
      - name: Download raw Iran OpenStreetMap data (ODbL)
        run: |
          curl --fail --location --retry 5 --retry-delay 15 \
            --connect-timeout 30 --max-time 900 \
            -o iran-latest.osm.pbf \
            https://download.geofabrik.de/asia/iran-latest.osm.pbf
          test "$(stat -c%s iran-latest.osm.pbf)" -gt 100000000
      - name: Render Tehran raster MBTiles independently of public tile servers
        run: |
          python -u scripts/build_tehran_mbtiles.py \
            iran-latest.osm.pbf tehran.mbtiles --minzoom 9 --maxzoom 15
      - name: Verify map pack and create SHA-256 release manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import json, hashlib, os, sqlite3, pathlib, datetime
          p=pathlib.Path('tehran.mbtiles')
          with sqlite3.connect(p) as db:
              meta=dict(db.execute('SELECT name,value FROM metadata').fetchall())
              total=db.execute('SELECT COUNT(*) FROM tiles').fetchone()[0]
              assert total>=1000, total
              assert meta['format']=='webp', meta
              assert meta['minzoom']=='9' and meta['maxzoom']=='15'
              assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          with p.open('rb') as f: sha=hashlib.file_digest(f,'sha256').hexdigest()
          dt=datetime.datetime.now(datetime.timezone.utc)
          edition=f'{dt.year}-Q{(dt.month-1)//3+1}-r{os.environ["GITHUB_RUN_NUMBER"]}'
          filename=f'tehran-{edition}.mbtiles'
          info={
              'edition':edition,
              'format':'raster_mbtiles',
              'url':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/tehran-offline-maps/{filename}',
              'sha256':sha,
              'bytes':p.stat().st_size,
              'bounds':[50.86,35.43,51.78,35.95],
              'source':'https://download.geofabrik.de/asia/iran-latest.osm.pbf',
              'attribution':'© OpenStreetMap contributors · ODbL 1.0',
              'minzoom':9, 'maxzoom':15,
              'published_at':dt.isoformat(),
          }
          pathlib.Path('manifest.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          pathlib.Path('map-asset-name.txt').write_text(filename,encoding='utf-8')
          print(f'Validated {total} map tiles; {p.stat().st_size/1048576:.1f} MiB; edition {edition}')
          PY
      - name: Publish map package before replacing manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view tehran-offline-maps >/dev/null 2>&1; then
            gh release create tehran-offline-maps \
              --title 'Raha Tehran - downloadable city map' \
              --notes 'Optional offline Tehran raster map built from Geofabrik OSM ODbL data. © OpenStreetMap contributors.' \
              --latest=false
          fi
          ASSET="$(cat map-asset-name.txt)"
          cp tehran.mbtiles "$ASSET"
          gh release upload tehran-offline-maps "$ASSET"
          gh release upload tehran-offline-maps manifest.json --clobber
          echo "Published $ASSET and current manifest.json"
      - name: Archive generated map manifest for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tehran-offline-map-build
          if-no-files-found: warn
          retention-days: 14
          path: |
            manifest.json
            map-asset-name.txt
            tehran.mbtiles
