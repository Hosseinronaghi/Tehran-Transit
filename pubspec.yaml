name: tehran_transit
description: Persian-first Tehran bus transit app
publish_to: none
version: 0.6.1+7
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_map_mbtiles: 1.0.4
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/transit.sqlite
    - assets/data/rail_brt.geojson
    - assets/fonts/OFL.txt
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazir-Bold.ttf
          weight: 700
