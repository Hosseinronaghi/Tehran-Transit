name: tehran_transit
description: Persian-first Tehran bus transit app
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
flutter:
  uses-material-design: true
  assets:
    - assets/data/transit.sqlite
    - assets/data/rail_brt.geojson
